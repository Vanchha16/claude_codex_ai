<script>
(() => {
  const root = document.getElementById('fvg-chart-stops-20261007');
  const svg = root.querySelector('.chart-reference');
  const image = root.querySelector('.source-chart');
  const clip = root.querySelector('.image-clip');
  const crop = { x: 610, y: 350, width: 754, height: 415 };
  const set = (element, values) => Object.entries(values).forEach(([key, value]) => element.setAttribute(key, value));
  function draw() {
    const width = Math.max(280, root.getBoundingClientRect().width);
    const scale = width / crop.width;
    const height = crop.height * scale;
    set(svg, { viewBox: `0 0 ${width} ${height}`, height });
    set(clip, { x: 0, y: 0, width, height });
    set(image, { x: -crop.x * scale, y: -crop.y * scale, width: 1364 * scale, height: 817 * scale });
    [
      { key: 'a', left: 655, y: 390 },
      { key: 'b', left: 704, y: 508 }
    ].forEach(stop => {
      const group = root.querySelector(`.stop-${stop.key}`);
      const y = (stop.y - crop.y) * scale;
      const x = (944 - crop.x) * scale;
      set(group.querySelector('.stop-mark'), { x1: (stop.left - crop.x) * scale, x2: (938 - crop.x) * scale, y1: y, y2: y });
      set(group.querySelector('.label-bg'), { x: x - 4, y: y - 12, width: 115, height: 24 });
      set(group.querySelector('.stop-label'), { x, y: y + 4 });
    });
  }
  draw();
  new ResizeObserver(draw).observe(root);
})();
</script>
